[package]
name = "tablune-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tablune_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tablune"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json = "1"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
rustpython-parser = "0.4.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tablune-core = { path = "../../../crates/tablune-core" }
tablune-csv = { path = "../../../crates/tablune-csv" }
tablune-history = { path = "../../../crates/tablune-history" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
