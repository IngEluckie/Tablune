name: Remove Temporary Diagnostics

on:
  push:
    branches: [bootstrap/csv-mvp]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/csv-mvp
      - name: Remove temporary diagnostic files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnostics.yml diagnostics.txt diagnostics-status.txt
          git commit -m "chore: remove temporary workspace diagnostics"
          git push origin HEAD:bootstrap/csv-mvp
