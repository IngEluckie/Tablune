name: Clippy Capture

on:
  push:
    branches: [bootstrap/csv-mvp]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/csv-mvp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy-output.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > clippy-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clippy-output.txt clippy-status.txt
          git commit -m "chore: capture Clippy diagnostics"
          git push origin HEAD:bootstrap/csv-mvp
