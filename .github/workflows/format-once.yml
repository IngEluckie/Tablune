name: Format Bootstrap Sources Once

on:
  push:
    branches: [bootstrap/csv-mvp]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/csv-mvp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format sources and remove this workflow
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-once.yml
          git add -- '*.rs'
          git commit -m "style: format bootstrap sources"
          git push origin HEAD:bootstrap/csv-mvp
